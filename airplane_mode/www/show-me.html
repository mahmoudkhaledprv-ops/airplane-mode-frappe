<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Me Colors</title>
</head>
<body>
    <div
        style="
            width: 400px;
            height: 200px;
            background-color: {{ color | e }};
        "
    ></div>
</body>
</html>
